name: PicaMD
options:
  bundleIdPrefix: de.michaelwittmann
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  schemePathPrefix: ""
  generateEmptyDirectories: true
schemes:
  PicaMD:
    build:
      targets:
        # Not for testing: the tests' host, PicaMDTestHost, compiles the
        # same module into the same products folder.
        PicaMD: [running, profiling, analyzing, archiving]
        # MCP test bundle has no host app, so xcodegen doesn't pull
        # it into the BuildAction transitively from the test list.
        # Explicitly include it for the testing build phase.
        PicaMDMCPTests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PicaMDTests
        - PicaMDMCPTests
      # No gatherCoverageData: the scheme's coverage flag also
      # instruments `xcodebuild build` and archive, so shipped binaries
      # carried profiling sections (app binary 4.3 MB instead of
      # 2.4 MB). CI passes `-enableCodeCoverage YES` to its test steps.
    archive:
      config: Release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Bundle version — single source of truth. release.sh and the
    # GitHub Actions workflow rewrite this in-place to match the git
    # tag they're building from. Local builds use whatever's checked
    # in.
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PicaMD/Info.plist
    # Names PicaMD/AppIcon.icon (Icon Composer, regenerated by
    # design/icon/build.sh). actool writes CFBundleIconFile and
    # CFBundleIconName into Info.plist itself. The full size set
    # (32 to 1024 px, light/dark/tinted) lives in Assets.car, so
    # ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR stays at its
    # default: the loose AppIcon.icns keeps four sizes (16 to 256 px),
    # which is all Finder/Quick Look fall back to, and `all` would add
    # about 0.5 MB for external tools only.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.6.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  PicaMD:
    type: application
    platform: macOS
    sources:
      - path: PicaMD
        excludes:
          - "Info.plist"
          - "Resources/katex/LICENSE"
      # KaTeX's MIT notice ships with the app. Xcode copies no file
      # without an extension unless told to.
      - path: PicaMD/Resources/katex/LICENSE
        buildPhase: resources
    resources:
      - path: PicaMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: Sparkle
        product: Sparkle
      - target: PicaMDQuickLook
      - target: PicaMDMCP
        embed: false
        link: false
    postBuildScripts:
      - name: Embed MCP sidecar
        # Copy the freshly-built `picamd-mcp` binary into the app
        # bundle's Resources folder so a single `cp -R PicaMD.app
        # /Applications/` install carries the sidecar too. Claude Code
        # references it via `/Applications/PicaMD.app/Contents/Resources/
        # picamd-mcp` in the user's `.mcp.json`.
        script: |
          set -e
          SIDECAR="${BUILT_PRODUCTS_DIR}/picamd-mcp"
          DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/picamd-mcp"
          if [ -f "$SIDECAR" ]; then
              cp "$SIDECAR" "$DEST"
              chmod +x "$DEST"
          else
              echo "warning: picamd-mcp binary not found at $SIDECAR — skipping embed"
          fi
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/picamd-mcp"
    settings:
      base:
        PRODUCT_NAME: PicaMD
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMD
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  PicaMDQuickLook:
    type: app-extension
    platform: macOS
    sources:
      # The provider itself.
      - path: PicaMDQuickLook
        excludes:
          - "Info.plist"
          - "PicaMDQuickLook.entitlements"
      # Re-compile the renderer + frontmatter parser + Theme types
      # into the extension. These have no dependencies on the rest of
      # the editor (highlighter, AppKit views), so the extension stays
      # tiny while still producing identical-looking HTML to what the
      # main app's Export menu emits.
      - path: PicaMD/Editor/MarkdownToHTML.swift
      - path: PicaMD/Editor/Frontmatter.swift
      - path: PicaMD/Editor/FootnoteIndex.swift
      - path: PicaMD/Editor/Theme.swift
      - path: PicaMD/Editor/PresetVariant.swift
      # Reads the encodings the app opens (UTF-16, Windows 1252, ...), so
      # Quick Look previews every file PicaMD can open.
      - path: PicaMD/Editor/TextFileEncoding.swift
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_NAME: PicaMDQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMD.QuickLook
        INFOPLIST_FILE: PicaMDQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: PicaMDQuickLook/PicaMDQuickLook.entitlements
        # Quick-Look extensions REQUIRE the sandbox entitlement to be
        # registered with `pkd`. Without it the extension is silently
        # rejected at install time.
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"

  PicaMDMCP:
    type: tool
    platform: macOS
    sources:
      - path: PicaMDMCP
      # Decodes and writes documents the way the app does (encoding,
      # byte order mark), so an MCP edit doesn't change how the file is
      # stored.
      - path: PicaMD/Editor/TextFileEncoding.swift
    settings:
      base:
        PRODUCT_NAME: picamd-mcp
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMD.mcp
        # The MCP sidecar is a plain command-line tool — no AppKit,
        # no entitlements, no sandbox. Lives inside the app bundle's
        # `Contents/MacOS/` directory and is invoked by Claude Code
        # via stdio.
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  PicaMDTestHost:
    # The app the unit tests run in: PicaMD's sources and resources under
    # the bundle identifier de.michaelwittmann.PicaMD.testhost. Hosted by
    # PicaMD.app, every test run wrote the user's real preferences
    # (recents, settings, AI configuration), saved window state and
    # system recents, which all hang off the bundle identifier.
    #
    # The module keeps the name `PicaMD`, so the tests' `@testable import
    # PicaMD` is unchanged. Both targets emit PicaMD.swiftmodule into the
    # same products folder, so they must never be built together: the
    # scheme builds PicaMD for running and archiving only, and only
    # PicaMDTests depends on the host. Release builds and archives never
    # build it.
    #
    # No Quick Look extension (its identifier would register a second
    # time with pkd) and no MCP sidecar: no test uses them.
    type: application
    platform: macOS
    sources:
      - path: PicaMD
        excludes:
          - "Info.plist"
    resources:
      - path: PicaMD/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Make the test host's Info.plist
        # The app's Info.plist without its Service and without the claim
        # to be the default app for Markdown, so the test host never shows
        # up in other apps' Services menus or opens the user's files.
        inputFiles:
          - "$(SRCROOT)/PicaMD/Info.plist"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/TestHost-Info.plist"
        script: |
          set -euo pipefail
          PLIST="${DERIVED_FILE_DIR}/TestHost-Info.plist"
          BUDDY=/usr/libexec/PlistBuddy
          mkdir -p "${DERIVED_FILE_DIR}"
          cp "${SRCROOT}/PicaMD/Info.plist" "$PLIST"
          # Only if present: Delete fails on a missing key, and under
          # `set -e` that would fail every test build.
          if "$BUDDY" -c "Print :NSServices" "$PLIST" >/dev/null 2>&1; then
              "$BUDDY" -c "Delete :NSServices" "$PLIST"
          fi
          i=0
          while "$BUDDY" -c "Print :CFBundleDocumentTypes:$i" "$PLIST" >/dev/null 2>&1; do
              "$BUDDY" -c "Set :CFBundleDocumentTypes:$i:LSHandlerRank None" "$PLIST"
              i=$((i + 1))
          done
    settings:
      base:
        PRODUCT_NAME: PicaMDTestHost
        PRODUCT_MODULE_NAME: PicaMD
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMD.testhost
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/TestHost-Info.plist"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  PicaMDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PicaMDTests
    dependencies:
      # Not PicaMD: the host compiles the same module (see PicaMDTestHost).
      - target: PicaMDTestHost
    settings:
      base:
        PRODUCT_NAME: PicaMDTests
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMDTests
        # Tests run with the same strict-concurrency setting as the
        # app so they catch the same regressions.
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  PicaMDMCPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # The test bundle needs to host the MCP source files directly —
      # Xcode test bundles can't `@testable import` a command-line
      # tool target. We compile a copy of each file we want to cover
      # into the test bundle. Keeps the sidecar binary itself unaware
      # of XCTest.
      - path: PicaMDMCPTests
      - path: PicaMDMCP/ToolRegistry.swift
      - path: PicaMDMCP/Tools.swift
      - path: PicaMDMCP/DocumentRegistry.swift
      - path: PicaMDMCP/MCPServer.swift
      - path: PicaMD/Editor/TextFileEncoding.swift
    dependencies:
      # No PicaMD: it made xcodegen host this bundle in PicaMD.app, so
      # every MCP run launched the real app with the user's preferences
      # domain, and it would build PicaMD next to PicaMDTestHost (see
      # there). The scheme lists the bundle for testing itself, which
      # keeps it in the BuildAction.
      - target: PicaMDMCP
        link: false
        embed: false
    settings:
      base:
        PRODUCT_NAME: PicaMDMCPTests
        PRODUCT_BUNDLE_IDENTIFIER: de.michaelwittmann.PicaMDMCPTests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
