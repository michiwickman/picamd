name: Feature request
description: An idea for a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PicaMD is meant to stay a small editor and viewer. Feature
        requests are welcome to discuss, but most won't be built unless
        they fit that scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user-experience need behind the feature, not the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. Sketch of how it might work — UI, shortcut, settings, etc.

  - type: dropdown
    id: priority
    attributes:
      label: How blocking is this for you?
      options:
        - "Nice-to-have"
        - "Would meaningfully change my workflow"
        - "Reason I'd pick another editor"
    validations:
      required: true
