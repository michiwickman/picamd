name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Release, Xcode 27)
    # macOS 27.0.1 with Xcode 27.0 as the image default. The deployment
    # target is macOS 27.0, which older Xcode releases cannot build, so
    # there is no second toolchain job.
    runs-on: xcode-27
    timeout-minutes: 25

    env:
      # 10 MB ceiling (MiB, as `du -sk` / 1024 / 1024 below). Measured on
      # the uninstrumented Release bundle of 0.10.0 (2026-10-21, local
      # build): 8.8 MiB = 2.9 app binary + 2.5 Sparkle + 1.0 Quick Look
      # extension + 1.7 Assets.car (the Icon Composer icon) + 0.6 other
      # resources incl. the MCP sidecar and KaTeX. A 9 MiB limit left
      # 0.2 MiB, so the next small feature would have tripped it; 10 MiB
      # leaves about 1.2 MiB. The old 12 MB limit was calibrated against a
      # coverage-instrumented build (10.1 MB).
      BUNDLE_SIZE_LIMIT_MB: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install build tools
        # xcbeautify ships with the runner image, xcodegen does not.
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests — main bundle
        # Coverage is requested here rather than in the scheme: the
        # scheme flag would also instrument the Release build below.
        run: |
          set -o pipefail
          xcodebuild \
            -project PicaMD.xcodeproj \
            -scheme PicaMD \
            -destination 'platform=macOS' \
            -resultBundlePath build-test/MainTests.xcresult \
            -enableCodeCoverage YES \
            -only-testing:PicaMDTests \
            test | xcbeautify

      - name: Run unit tests — MCP sidecar bundle
        # `xcodebuild test` against the scheme runs both bundles
        # eventually but serialises them with a long delay between
        # (observed ~30 min). Running each invocation separately
        # finishes in seconds.
        run: |
          set -o pipefail
          xcodebuild \
            -project PicaMD.xcodeproj \
            -scheme PicaMD \
            -destination 'platform=macOS' \
            -resultBundlePath build-test/MCPTests.xcresult \
            -enableCodeCoverage YES \
            -only-testing:PicaMDMCPTests \
            test | xcbeautify

      - name: Build Release bundle
        run: |
          set -o pipefail
          xcodebuild \
            -project PicaMD.xcodeproj \
            -scheme PicaMD \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-release \
            build | xcbeautify

      - name: Bundle-size guard
        shell: bash
        run: |
          APP="build-release/Build/Products/Release/PicaMD.app"
          if [ ! -d "$APP" ]; then
            echo "::error ::Release build did not produce $APP"
            exit 1
          fi
          BYTES=$(du -sk "$APP" | awk '{print $1 * 1024}')
          MB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1024/1024 }')
          LIMIT_MB="${BUNDLE_SIZE_LIMIT_MB}"
          echo "Bundle size: ${MB} MB (limit ${LIMIT_MB} MB)"
          # Fail if bundle exceeds limit
          awk -v b="$BYTES" -v lim="$LIMIT_MB" 'BEGIN {
            limit_bytes = lim * 1024 * 1024;
            if (b > limit_bytes) {
              printf "::error ::Bundle (%.2f MB) exceeds limit of %s MB\n", b/1024/1024, lim;
              exit 1;
            }
          }'

      - name: Verify only Apple system libs are linked
        shell: bash
        run: |
          set -e
          APP="build-release/Build/Products/Release/PicaMD.app"
          BIN="$APP/Contents/MacOS/PicaMD"

          # 1. The main binary's direct dependencies must be either
          #    Apple system libs (/System, /usr) or whitelisted
          #    embedded frameworks (Sparkle, for auto-update).
          #    Anything else is an accidentally-bundled third-party dep.
          ALLOWED_RPATH='@rpath/Sparkle\.framework/'
          NON_APPLE=$(otool -L "$BIN" \
            | tail -n +2 \
            | awk '{print $1}' \
            | grep -v -E '^(/System|/usr)' \
            | grep -v -E "^${ALLOWED_RPATH}" || true)
          if [ -n "$NON_APPLE" ]; then
            echo "::error ::Non-Apple direct linkage detected (and not whitelisted):"
            echo "$NON_APPLE"
            exit 1
          fi

          # 2. Embedded frameworks are restricted to the whitelist.
          #    Sparkle is the only third-party framework we knowingly
          #    embed (auto-update is non-negotiable for a public
          #    release). Anything else here is unintentional bloat.
          if [ -d "$APP/Contents/Frameworks" ]; then
            UNEXPECTED=$(find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 \
              \( -name '*.framework' -o -name '*.dylib' \) \
              ! -name 'Sparkle.framework' -print)
            if [ -n "$UNEXPECTED" ]; then
              echo "::error ::Unexpected embedded frameworks (only Sparkle.framework is allowed):"
              echo "$UNEXPECTED"
              exit 1
            fi
          fi

          echo "✓ Linked libs are either Apple system libraries or the whitelisted Sparkle framework."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build-test/
          retention-days: 7

      - name: Upload Release bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: PicaMD-${{ github.sha }}.app
          path: build-release/Build/Products/Release/PicaMD.app
          retention-days: 7
